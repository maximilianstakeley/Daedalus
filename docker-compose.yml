services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: daedalus-postgis
    environment:
      POSTGRES_DB: daedalus
      POSTGRES_USER: daedalus
      POSTGRES_PASSWORD: change-this-local-dev-password
    ports:
      - "5432:5432"
    volumes:
      - daedalus_postgis_data:/var/lib/postgresql/data
      - ./integrations/postgis/schema.sql:/docker-entrypoint-initdb.d/001-daedalus.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daedalus -d daedalus"]
      interval: 10s
      timeout: 5s
      retries: 10

  geoserver:
    image: docker.osgeo.org/geoserver:3.0.2
    profiles: ["geospatial"]
    container_name: daedalus-geoserver
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: change-this-local-dev-password
    ports:
      - "8080:8080"
    depends_on:
      postgis:
        condition: service_healthy
    volumes:
      - daedalus_geoserver_data:/opt/geoserver_data

  kafka:
    image: apache/kafka:4.3.2
    profiles: ["streaming"]
    container_name: daedalus-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - daedalus_kafka_data:/var/lib/kafka/data

volumes:
  daedalus_postgis_data:
  daedalus_geoserver_data:
  daedalus_kafka_data:
